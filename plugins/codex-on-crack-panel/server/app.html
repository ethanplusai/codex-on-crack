<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex on Crack</title>
<style>
/* Framework-free MCP App styles. */

@layer base {
  :root {
    color-scheme: light dark;
    --background: var(
      --color-background-primary,
      light-dark(rgb(255 255 255), rgb(24 24 24))
    );
    --foreground: var(
      --color-text-primary,
      light-dark(rgb(26 28 31), rgb(255 255 255))
    );
    --card: color-mix(in oklab, var(--foreground) 5%, var(--background));
    --card-foreground: var(--color-text-primary, var(--foreground));
    --primary: var(
      --color-text-info,
      light-dark(rgb(51 156 255), rgb(131 195 255))
    );
    --primary-foreground: var(
      --color-text-inverse,
      light-dark(rgb(255 255 255), rgb(13 13 13))
    );
    --secondary: var(
      --color-background-secondary,
      light-dark(rgb(255 255 255 / 96%), rgb(54 54 54 / 96%))
    );
    --secondary-foreground: var(--color-text-primary, var(--foreground));
    --muted: color-mix(in srgb, var(--foreground) 10%, transparent);
    --muted-foreground: var(
      --color-text-secondary,
      light-dark(rgb(26 28 31 / 49.4%), rgb(255 255 255 / 49.8%))
    );
    --accent: var(
      --color-background-info,
      light-dark(rgb(229 242 255), rgb(13 39 63))
    );
    --accent-foreground: var(--color-text-info, var(--primary));
    --destructive: var(
      --color-text-warning,
      light-dark(rgb(226 85 7), rgb(255 133 73))
    );
    --border: var(
      --color-border-secondary,
      light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
    );
    --input: var(
      --color-border-primary,
      light-dark(rgb(26 28 31 / 11.8%), rgb(255 255 255 / 12%))
    );
    --ring: var(--color-ring-primary, var(--primary));
    --font-size-base: var(--font-text-md-size, 14px);
    --radius: var(--border-radius-lg, 12.5px);
  }

  :root[data-theme="light"] {
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
  }

  body {
    margin: 0;
    color: var(--foreground);
    background: var(--background);
    font-size: max(11px, var(--font-size-base));
    font-weight: var(--font-weight-normal, 430);
    line-height: 1.5;
  }

  /* MCP sandboxes can force their own font on body, so restore the host font below it. */
  body,
  body > * {
    font-family: var(
      --font-sans,
      -apple-system,
      system-ui,
      "Segoe UI",
      sans-serif
    );
  }

  h1,
  h2,
  h3,
  p {
    margin-block: 0;
  }

  h1,
  h2,
  h3 {
    font-weight: var(--font-weight-medium, 500);
    line-height: 1.25;
  }

  h1 {
    font-size: calc(var(--font-size-base) * 1.7142857143);
  }

  h2 {
    font-size: calc(var(--font-size-base) * 1.4285714286);
  }

  h3 {
    font-size: calc(var(--font-size-base) * 1.2857142857);
  }
}

@layer components {
  .cursor-interaction {
    cursor: var(--cursor-interaction, pointer);
  }

  .card {
    min-width: 0;
    padding: 12px;
    overflow-wrap: break-word;
    border-radius: calc(var(--radius) * 1.6);
    corner-shape: superellipse(1.5);
    color: var(--card-foreground);
    background: var(--card);
  }

  .btn,
  .form-check-input,
  .form-control,
  .form-select {
    box-sizing: border-box;
    font: inherit;
  }

  .btn {
    appearance: button;
    display: inline-flex;
    inline-size: fit-content;
    max-inline-size: 100%;
    min-height: 28px;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin: 0;
    padding: 0 8px;
    border: 1px solid var(--input);
    border-radius: var(--radius);
    corner-shape: superellipse(1.5);
    color: var(--secondary-foreground);
    background: var(--secondary);
    cursor: var(--cursor-interaction, pointer);
    text-align: center;
    text-decoration: none;
    white-space: nowrap;
    user-select: none;
  }

  .btn:not(:disabled):hover {
    background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
  }

  .btn-primary {
    border-color: transparent;
    color: var(--primary-foreground);
    background: var(--foreground);
    background-clip: padding-box;
  }

  .btn-primary:not(:disabled):hover {
    background: color-mix(in srgb, var(--foreground) 80%, transparent);
    background-clip: padding-box;
  }

  .btn-ghost {
    border-color: transparent;
    color: var(--muted-foreground);
    background: transparent;
  }

  .btn-ghost:not(:disabled):hover {
    color: var(--foreground);
    background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
  }

  .btn:not(.btn-primary):is([aria-pressed="true"], [aria-selected="true"]) {
    border-color: var(--primary);
    color: var(--primary-foreground);
    background: var(--primary);
  }

  .btn:focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }

  .btn:disabled,
  .form-check-input:disabled,
  .form-control:disabled,
  .form-select:disabled {
    cursor: not-allowed;
    opacity: 0.4;
  }

  .form-label {
    display: block;
    margin-bottom: 6px;
    color: var(--foreground);
  }

  .form-control,
  .form-select {
    display: block;
    width: 100%;
    min-height: 28px;
    padding: 0 8px;
    outline: none;
    border: 1px solid var(--input);
    border-radius: var(--radius);
    corner-shape: superellipse(1.5);
    color: var(--foreground);
    background: var(--secondary);
  }

  .form-control::placeholder {
    color: var(--muted-foreground);
  }

  .form-select {
    appearance: none;
    padding-right: 32px;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
      linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
    background-position:
      calc(100% - 14px) 50%,
      calc(100% - 10px) 50%;
    background-repeat: no-repeat;
    background-size: 4px 4px;
    cursor: var(--cursor-interaction, pointer);
  }

  .form-select:not(:disabled):hover {
    background-color: color-mix(
      in srgb,
      var(--foreground) 6%,
      var(--secondary)
    );
  }

  textarea.form-control {
    min-height: 72px;
    padding: 8px 10px;
    resize: vertical;
  }

  .form-control:focus-visible,
  .form-select:focus-visible {
    border-color: var(--ring);
    box-shadow: inset 0 0 0 1px var(--ring);
  }

  .form-check {
    display: flex;
    min-height: 20px;
    align-items: center;
    gap: 8px;
  }

  .form-check-input {
    appearance: none;
    display: grid;
    width: 16px;
    height: 16px;
    flex: 0 0 auto;
    place-items: center;
    margin: 0;
    border: 1px solid var(--input);
    border-radius: 5px;
    corner-shape: superellipse(1.5);
    color: var(--primary-foreground);
    background: var(--secondary);
    cursor: var(--cursor-interaction, pointer);
  }

  .form-check-input:checked {
    border-color: var(--primary);
    background: var(--primary);
  }

  .form-check-input:checked::after {
    width: 7px;
    height: 4px;
    border-bottom: 2px solid currentColor;
    border-left: 2px solid currentColor;
    content: "";
    transform: translateY(-1px) rotate(-45deg);
  }

  .form-check-input:focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }

  .form-check-label {
    color: var(--foreground);
  }

  svg.lucide {
    display: block;
    width: 16px;
    height: 16px;
    flex: none;
    stroke-width: 1.6;
  }

  .text-small {
    font-size: max(11px, calc(var(--font-size-base) - 2px));
  }

  .text-muted {
    color: var(--muted-foreground);
  }

  .text-destructive {
    color: var(--destructive);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
}

</style>
<style>
/* Build panel: a flat Codex utility inspector. Monochrome neutral surfaces;
   colour is reserved for warnings and failures. Host style variables (MCP
   Apps) take precedence; the fallbacks match the official SDK stylesheet.
   Variables are prefixed so they never collide with the SDK's own tokens. */
:root {
  color-scheme: light dark;
  --p-bg: var(--color-background-primary, light-dark(#ffffff, #181818));
  --p-fg: var(--color-text-primary, light-dark(#1a1c1f, #f3f3f3));
  --p-fg-2: var(--color-text-secondary, light-dark(rgb(26 28 31 / 62%), rgb(255 255 255 / 60%)));
  --p-fg-3: var(--color-text-tertiary, light-dark(rgb(26 28 31 / 44%), rgb(255 255 255 / 40%)));
  --p-line: var(--color-border-secondary, light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8%)));
  --p-line-strong: var(--color-border-primary, light-dark(rgb(26 28 31 / 13%), rgb(255 255 255 / 13%)));
  --p-hover: color-mix(in srgb, var(--p-fg) 5%, transparent);
  --p-selected: color-mix(in srgb, var(--p-fg) 8%, transparent);
  --p-raised: color-mix(in oklab, var(--p-fg) 4%, var(--p-bg));
  --p-inverse: var(--color-text-inverse, var(--p-bg));
  --p-ring: var(--color-ring-primary, color-mix(in srgb, var(--p-fg) 55%, transparent));
  --p-ok: var(--color-text-success, light-dark(#2f7a4c, #7cc996));
  --p-warn: var(--color-text-warning, light-dark(#a15500, #f0ad5c));
  --p-bad: var(--color-text-danger, light-dark(#c2382d, #ff8576));
  --p-radius: var(--border-radius-md, 8px);
  --p-radius-lg: var(--border-radius-lg, 12px);
  --p-size: var(--font-text-sm-size, 13px);
  --p-size-sm: max(11px, calc(var(--p-size) - 1px));
  --p-font: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif);
  --p-mono: var(--font-mono, ui-monospace, "SF Mono", Menlo, monospace);
  --p-medium: var(--font-weight-medium, 500);
  --p-semibold: var(--font-weight-semibold, 600);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--p-bg);
  color: var(--p-fg);
  font: var(--p-size)/1.45 var(--p-font);
  -webkit-font-smoothing: antialiased;
}
button, select, textarea, input { font: inherit; color: inherit; }
h1, h2, h3, p, ul, dl, figure { margin: 0; }
ul { padding: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--p-fg-2); }
.small { font-size: var(--p-size-sm); }
.num { font-variant-numeric: tabular-nums; }
.spacer, .grow { flex: 1; min-width: 0; }
.unknown { color: var(--p-fg-3); font-style: italic; }
code { font-family: var(--p-mono); font-size: 0.92em; color: var(--p-fg-2); overflow-wrap: anywhere; }

/* Native host focus ring everywhere a control can take keyboard focus. */
:focus-visible { outline: 2px solid var(--p-ring); outline-offset: 2px; }
.tab:focus-visible, .row:focus-visible, .subtab:focus-visible, summary:focus-visible { outline-offset: -2px; border-radius: 4px; }

#app { container-type: inline-size; min-height: 100vh; }
.shell { min-height: 100vh; display: flex; flex-direction: column; }

/* ---------------------------------------------------------------- header */
.topbar { border-bottom: 1px solid var(--p-line); padding: 0 16px; }
.titlebar { display: flex; align-items: baseline; gap: 8px; min-height: 40px; padding-top: 10px; }
.titlebar h1 { font-size: var(--p-size); font-weight: var(--p-semibold); white-space: nowrap; }
.titlebar .sub { color: var(--p-fg-3); font-size: var(--p-size-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.conn { display: inline-flex; align-items: center; gap: 6px; font-size: var(--p-size-sm); color: var(--p-fg-3); white-space: nowrap; }
.conn::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--p-fg-3); }
.conn.live::before { background: var(--p-fg-2); }
.conn.lost { color: var(--p-bad); }
.conn.lost::before { background: var(--p-bad); }

.tabs { display: flex; gap: 18px; margin-top: 2px; }
.tab {
  position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 8px 0 9px; border: 0; background: none;
  color: var(--p-fg-2); font-weight: var(--p-medium); cursor: var(--cursor-interaction, pointer); white-space: nowrap;
}
.tab:hover { color: var(--p-fg); }
.tab[aria-selected="true"] { color: var(--p-fg); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1.5px; background: var(--p-fg); border-radius: 1px; }
.count { min-width: 16px; padding: 0 4px; border-radius: 8px; background: var(--p-selected); color: var(--p-fg-2); font-size: 11px; line-height: 16px; text-align: center; font-variant-numeric: tabular-nums; }

/* One-line strips under the header: demo provenance, lost connection. */
.strip { display: flex; align-items: center; gap: 10px; padding: 6px 16px; border-bottom: 1px solid var(--p-line); font-size: var(--p-size-sm); color: var(--p-fg-2); }
.strip strong { color: var(--p-fg); font-weight: var(--p-medium); }
.strip.lost, .strip.lost strong { color: var(--p-bad); }

/* ---------------------------------------------------------------- buttons */
.button {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px;
  border-radius: var(--p-radius); border: 1px solid var(--p-line-strong); background: transparent;
  font-weight: var(--p-medium); cursor: var(--cursor-interaction, pointer); white-space: nowrap;
}
.button.small { height: 26px; padding: 0 9px; font-size: var(--p-size-sm); }
.button:hover:not(:disabled) { background: var(--p-hover); }
.button.primary { background: var(--p-fg); border-color: transparent; color: var(--p-inverse); }
.button.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--p-fg) 82%, transparent); }
.button.danger { background: var(--p-bad); border-color: transparent; color: #fff; }
.button.ghost { border-color: transparent; color: var(--p-fg-2); }
.button.ghost:hover:not(:disabled) { color: var(--p-fg); }
.button:disabled { opacity: 0.4; cursor: default; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.reason { font-size: var(--p-size-sm); color: var(--p-fg-3); }

/* ---------------------------------------------------------------- status */
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--p-fg-3); flex: none; }
.dot.live { background: var(--p-fg); }
.dot.ok { background: var(--p-ok); }
.dot.warn { background: var(--p-warn); }
.dot.bad { background: var(--p-bad); }
.dot.hollow { background: transparent; box-shadow: inset 0 0 0 1px var(--p-fg-3); }
@media (prefers-reduced-motion: no-preference) {
  .dot.pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
}
.status { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.status.warn { color: var(--p-warn); }
.status.bad { color: var(--p-bad); }

.line { display: flex; flex-wrap: wrap; align-items: center; row-gap: 2px; min-width: 0; }
.line > * + *::before { content: "·"; margin: 0 6px; color: var(--p-fg-3); font-style: normal; }
.subline { color: var(--p-fg-2); font-size: var(--p-size-sm); margin-top: 3px; }

.notice { padding: 7px 10px; border-radius: var(--p-radius); font-size: var(--p-size-sm); background: var(--p-raised); }
.notice.warn { color: var(--p-warn); }
.notice.bad { color: var(--p-bad); }
.notice strong { font-weight: var(--p-medium); }

/* ---------------------------------------------------------------- layout */
.split { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; }
.sidebar { border-bottom: 1px solid var(--p-line); padding: 6px 8px 10px; min-width: 0; }
@container (min-width: 680px) {
  .split { grid-template-columns: 250px minmax(0, 1fr); align-content: stretch; }
  .sidebar { border-bottom: 0; border-right: 1px solid var(--p-line); }
}
.detail { display: grid; gap: 18px; align-content: start; padding: 16px 20px 32px; min-width: 0; max-width: 1080px; }

.detail-head { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.detail-head h2 { font-size: calc(var(--p-size) + 3px); font-weight: var(--p-semibold); line-height: 1.3; overflow-wrap: anywhere; }
.detail-head .grow { min-width: 200px; }
.head-actions { display: grid; gap: 4px; justify-items: end; max-width: 46ch; }
.head-actions .reason { text-align: right; }

.facts-row { display: flex; flex-wrap: wrap; gap: 8px 28px; padding-bottom: 14px; border-bottom: 1px solid var(--p-line); }
.facts-row div { min-width: 0; }
.facts-row dt { font-size: var(--p-size-sm); color: var(--p-fg-3); }
.facts-row dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.section { display: grid; gap: 6px; min-width: 0; }
.section-head { display: flex; align-items: baseline; gap: 10px; }
.section-head h3 { font-size: var(--p-size); font-weight: var(--p-semibold); }
.section-head .aside { color: var(--p-fg-3); font-size: var(--p-size-sm); }

/* ---------------------------------------------------------------- tree */
.group { display: flex; align-items: baseline; gap: 8px; padding: 10px 8px 4px; font-size: var(--p-size-sm); font-weight: var(--p-medium); color: var(--p-fg-3); }
.group-aside { margin-left: auto; font-weight: normal; }
.pad { padding: 2px 8px; }
.row {
  width: 100%; display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  text-align: left; border: 0; background: transparent; padding: 5px 8px; border-radius: 6px; cursor: var(--cursor-interaction, pointer);
}
.row:hover { background: var(--p-hover); }
.row[aria-pressed="true"] { background: var(--p-selected); }
.row-text { display: grid; min-width: 0; }
.row-text .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .title { font-weight: var(--p-medium); }
.row-text .meta { font-size: var(--p-size-sm); color: var(--p-fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-text .meta.wrap { white-space: normal; overflow-wrap: anywhere; }
.row .aside { font-size: var(--p-size-sm); color: var(--p-fg-3); }
.children { margin: 0 0 2px 10px; padding-left: 10px; border-left: 1px solid var(--p-line); }
.leaf { display: grid; grid-template-columns: 6px minmax(0, 1fr); gap: 10px; align-items: center; padding: 3px 8px; font-size: var(--p-size-sm); }
.leaf .meta { color: var(--p-fg-3); }

.launch { margin-top: 6px; padding-top: 4px; border-top: 1px solid var(--p-line); }
.profile { display: grid; gap: 4px; padding: 4px 8px 6px; }
.profile-head { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.profile-head .title { font-weight: var(--p-medium); }
.gate { display: flex; gap: 6px; align-items: center; font-size: var(--p-size-sm); color: var(--p-fg-2); }
.reasons { list-style: none; display: grid; gap: 2px; }

/* ---------------------------------------------------------------- lists */
.list { list-style: none; }
.item { display: grid; grid-template-columns: 6px minmax(0, 1fr); gap: 10px; align-items: center; padding: 5px 0; border-top: 1px solid var(--p-line); }
.item:first-child { border-top: 0; }
.activity li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 4px 0; border-top: 1px solid var(--p-line); }
.activity li:first-child { border-top: 0; }
.activity time { white-space: nowrap; color: var(--p-fg-3); font-size: var(--p-size-sm); font-variant-numeric: tabular-nums; padding-top: 1px; }
.activity span { overflow-wrap: anywhere; }
.bullets { padding-left: 18px; color: var(--p-fg-2); }
.bullets li { padding: 1px 0; }
.bullets li::marker { color: var(--p-fg-3); }

/* ---------------------------------------------------------------- disclosure */
.disclosure { border-top: 1px solid var(--p-line); padding-top: 8px; }
.disclosure summary {
  display: inline-flex; align-items: center; gap: 6px; list-style: none; cursor: var(--cursor-interaction, pointer);
  color: var(--p-fg-2); font-size: var(--p-size-sm); font-weight: var(--p-medium); padding: 2px 0;
}
.disclosure summary::-webkit-details-marker { display: none; }
.disclosure summary::before { content: ""; width: 5px; height: 5px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); margin-right: 2px; transition: transform 0.12s; }
.disclosure[open] summary::before { transform: rotate(45deg) translate(-1px, -1px); }
.disclosure summary:hover { color: var(--p-fg); }
.disclosure-body { padding: 8px 0 2px; }
.notes { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; font-size: var(--p-size-sm); }
.notes div { display: contents; }
.notes dt { color: var(--p-fg-3); }
.notes dd { margin: 0; color: var(--p-fg-2); overflow-wrap: anywhere; }

/* ---------------------------------------------------------------- review */
.review { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 16px; border-bottom: 1px solid var(--p-line); }
.subtabs { display: flex; gap: 2px; flex-wrap: wrap; min-width: 0; }
.subtab, .toggle button {
  display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 9px; border: 0; border-radius: 6px;
  background: transparent; color: var(--p-fg-2); font-size: var(--p-size-sm); font-weight: var(--p-medium); cursor: var(--cursor-interaction, pointer); white-space: nowrap;
}
.subtab:hover, .toggle button:hover { color: var(--p-fg); background: var(--p-hover); }
